{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar mascota - Veterinaria Huellitas</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <span class="brand">Veterinaria Huellitas</span>

            <a href="{% url 'inicio' %}" class="button button-light">
                Inicio
            </a>
        </div>
    </nav>

    <main class="main">
        <div class="container">

            <div class="card card-medium">

                <h2 class="center">Registrar mascota</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Nombre del dueño</label>
                        <input type="text" name="dueno" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" name="telefono" required>
                    </div>

                    <div class="form-group">
                        <label>Nombre de la mascota</label>
                        <input type="text" name="mascota" required>
                    </div>

                    <div class="form-group">
                        <label>Tipo de mascota</label>
                        <select name="tipo" required>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Raza</label>
                        <input type="text" name="raza" required>
                    </div>

                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" name="edad" required>
                    </div>

                    <div class="form-group">
                        <label>Sexo</label>
                        <select name="sexo" required>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Motivo de consulta</label>
                        <input type="text" name="motivo" required>
                    </div>

                    <button type="submit" class="button button-full">
                        Guardar registro
                    </button>
                </form>

                {% if mensaje %}
                    <div class="alert alert-success">
                        {{ mensaje }}
                    </div>
                {% endif %}

            </div>

        </div>
    </main>

</body>

</html>
